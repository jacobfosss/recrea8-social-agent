# Recrea8 Social Agent — full configuration
# Fill in any remaining bracketed placeholders as needed.

brand_name: "Recrea8"

brand_voice: >
  Informational, professional, and warm — never preachy or fear-based.
  Speaks like a knowledgeable friend who genuinely cares about what people put
  in their bodies. Confident about the science without being clinical.
  Leads with "healthy indulgence": food should feel good AND be good for you,
  never a tradeoff.

brand_context: >
  Recrea8 was founded by Zach and Jacob, who bonded over a shared passion for
  whole foods and recreating a better food system. Both are obsessed with
  sports, nutrition, training, recovery, and how they all connect through what
  we eat. That passion led them to interview nutritionists across the NBA,
  NFL, and MLB — and they kept hearing the same thing: professional athletes
  were already eating tons of ice cream for recovery and enjoyment, but there
  was no genuinely clean option built for how hard their bodies work. So they
  built one — engineering every ingredient around what those nutritionists
  said their athletes actually needed: magnesium glycinate for recovery,
  grass-fed whey for protein, real ingredients throughout. No artificial
  sweeteners, dyes, or ultra-processed fillers — just whole food your body
  actually recognizes, built by people who understand what performance and
  recovery really demand.

topics:
  # Core brand education
  - "how ultra-processed ingredients affect the body"
  - "reading a nutrition label like a pro"
  - "what 'natural flavors' actually means"
  - "whole food swaps for common pantry staples"

  # Ingredient spotlight series — what IS in our label
  - "why we use honey instead of refined sugar"
  - "grass-fed whey protein and why it matters"
  - "spirulina in our mint cacao flavor"
  - "why magnesium glycinate specifically"
  - "cacao vs regular cocoa"
  - "why real egg yolk instead of stabilizers"

  # "What's NOT in our label" series — research-backed
  - "why we don't use allulose"
  - "artificial sweeteners hidden in 'healthy' ice cream"
  - "corn syrup in conventional ice cream"
  - "gums and stabilizers — what they do to your gut"
  - "seed oils in frozen desserts"
  - "artificial food coloring in ice cream"

  # Lifestyle / occasion-based
  - "post-workout recovery ice cream"
  - "picnic dessert ideas"
  - "affogato and coffee dessert pairings"
  - "ice cream as a healthy indulgence, not a cheat day"

aesthetic:
  description: >
    Clean, minimal, beautiful. Soft natural color palette (warm neutrals,
    sage, cream) rather than saturated candy-brand colors. Generous white
    space. Bold confident typography. Feels premium and trustworthy, not
    clinical or sterile — approachable "healthy indulgence," not deprivation.

platforms:
  instagram: true
  tiktok: true

posting:
  mode: auto
  caption_max_words: 60
  hashtag_count: 5
  # If true, nothing posts automatically — every piece of content becomes a
  # GitHub issue for you to review and comment "approve" on first. Strongly
  # recommended for at least the first few weeks.
  require_approval: true
  content_mix:
    library: 0.25       # your own uploaded photos/videos
    educational: 0.45   # research-backed nutrition science posts
    lifestyle: 0.30      # generated on-brand quote/graphic cards

content_generation:
  image_style: "clean minimal quote card, bold sans-serif text, soft natural color palette"
  # If true, educational posts become short narrated videos (Piper voiceover)
  # instead of static graphic cards.
  educational_as_video: false

content_calendar:
  monday:
    pillar: "Mythbusting Monday"
    content_type: educational
  wednesday:
    pillar: "Ingredient Spotlight"
    content_type: lifestyle
  friday:
    pillar: "Weekend Ready — recipe or use-case"
    content_type: library

research:
  topics:
    # Ultra-processed food & inflammation
    - "ultra-processed food inflammation"
    - "ultra-processed food cardiovascular disease risk"
    - "diet quality systemic inflammation biomarkers"

    # Artificial sweeteners & sugar substitutes
    - "artificial sweeteners food health effects"
    - "allulose metabolic effects"
    - "aspartame health effects research"
    - "sucralose gut microbiome"
    - "artificial sweeteners insulin response"

    # Sugar & metabolic health
    - "added sugar chronic disease risk"
    - "added sugar insulin resistance"
    - "high fructose corn syrup metabolic effects"

    # Additives, stabilizers, emulsifiers
    - "carrageenan gum gut health"
    - "food emulsifiers gut microbiome"
    - "gums stabilizers digestive health"
    - "artificial food dye health effects"
    - "food dye hyperactivity children research"

    # Fats & oils
    - "seed oil inflammation research"
    - "omega-6 omega-3 ratio inflammation"

    # Whole foods & positive nutrition
    - "whole foods gut microbiome"
    - "anti-inflammatory diet clinical trial"
    - "whey protein muscle recovery research"
    - "magnesium glycinate athletic recovery"
    - "spirulina antioxidant health benefits"
    - "cacao flavanols cardiovascular health"
  per_topic: 2

engagement:
  # Auto-replies to comments on YOUR OWN posts (sanctioned use of the API).
  auto_reply_to_own_comments: false
  # For the weekly human-in-the-loop digest: public Instagram Business/Creator
  # accounts (usernames, no @) you'd like suggested comments drafted for.
  # You review data/engagement_digest.md and post them yourself.
  accounts_to_monitor:
    - "example_account_1"
    - "example_account_2"
  posts_per_account: 3

stories:
  enabled: true
  # "auto" alternates between a fresh quick-tip card and reposting your most
  # recent feed post. "quick_tip" or "repost" to force one.
  mode: auto
  # Stories are ephemeral/24hr and lower-stakes than feed posts, so these
  # default to posting directly rather than through the approval queue.
  require_approval: false