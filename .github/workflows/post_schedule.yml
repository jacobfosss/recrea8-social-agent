name: Autonomous social posting

on:
  schedule:
    # 3x/day, normal weighted-random content selection (educational/
    # lifestyle/library mix per config.yaml's content_mix) — inside
    # TikTok's real sweet spot for a growing account, per 2026 guidance.
    - cron: "0 8 * * *"
    - cron: "0 14 * * *"
    - cron: "0 20 * * *"
    # Creative/witty pillar — deliberately curated, not left to random
    # chance. Always requires approval (enforced in code, not just config).
    - cron: "0 18 * * 2"    # Tuesday
    - cron: "0 18 * * 5"    # Friday
  workflow_dispatch:
    inputs:
      content_type:
        description: "Force a content type (leave blank for normal weighted pick)"
        required: false
        type: choice
        options: ["", "educational", "lifestyle", "library", "creative"]

permissions:
  contents: write
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Piper voice model
        uses: actions/cache@v4
        with:
          path: data/voices
          key: piper-voices-v1

      - name: Determine content type for this run
        id: content_type
        run: |
          if [ -n "${{ github.event.inputs.content_type }}" ]; then
            echo "type=${{ github.event.inputs.content_type }}" >> "$GITHUB_OUTPUT"
          else
            HOUR=$(date -u +%H)
            DOW=$(date -u +%u)
            if { [ "$DOW" = "2" ] || [ "$DOW" = "5" ]; } && [ "$HOUR" = "18" ]; then
              echo "type=creative" >> "$GITHUB_OUTPUT"
            else
              echo "type=" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: |
          if [ -n "${{ steps.content_type.outputs.type }}" ]; then
            python -m src.main --content-type "${{ steps.content_type.outputs.type }}"
          else
            python -m src.main
          fi

      - name: Commit updated log
        run: |
          git config user.name "social-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/posted_log.json content/posted/ content/generated/ || true
          git diff --cached --quiet || git commit -m "Update posted log / add media [skip ci]"
          git push