name: Autonomous social posting

on:
  schedule:
    # Educational: checks in 8x/day, but only actually posts ONCE — timing
    # starts random and automatically shifts toward the historically
    # best-performing hour once enough real engagement data exists (see
    # src/time_optimizer.py). This is intentionally MORE checks than
    # posts — most checks will just print "not posting" and exit quickly.
    - cron: "0 8 * * *"
    - cron: "0 10 * * *"
    - cron: "0 12 * * *"
    - cron: "0 14 * * *"
    - cron: "0 16 * * *"
    - cron: "0 18 * * *"
    - cron: "0 20 * * *"
    - cron: "0 22 * * *"
    # Lifestyle/library: normal weighted-random rotation, 3x/day
    - cron: "0 9 * * *"
    - cron: "0 15 * * *"
    - cron: "0 21 * * *"
    # Creative: deliberately curated, not random — Tue/Fri only, always
    # requires approval (enforced in code, not just this schedule)
    - cron: "0 18 * * 2"
    - cron: "0 18 * * 5"
  workflow_dispatch:
    inputs:
      content_type:
        description: "Force a content type (leave blank for scheduled default)"
        required: false
        type: choice
        options: ["", "educational", "lifestyle", "library", "creative"]

permissions:
  contents: write
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Piper voice model
        uses: actions/cache@v4
        with:
          path: data/voices
          key: piper-voices-v1

      - name: Determine what this run should do
        id: run_config
        run: |
          if [ -n "${{ github.event.inputs.content_type }}" ]; then
            echo "type=${{ github.event.inputs.content_type }}" >> "$GITHUB_OUTPUT"
            echo "scheduled_check=false" >> "$GITHUB_OUTPUT"
          else
            HOUR=$(date -u +%H)
            DOW=$(date -u +%u)
            EDUCATIONAL_HOURS="8 10 12 14 16 18 20 22"
            if { [ "$DOW" = "2" ] || [ "$DOW" = "5" ]; } && [ "$HOUR" = "18" ]; then
              echo "type=creative" >> "$GITHUB_OUTPUT"
              echo "scheduled_check=false" >> "$GITHUB_OUTPUT"
            elif echo "$EDUCATIONAL_HOURS" | grep -qw "$HOUR"; then
              echo "type=educational" >> "$GITHUB_OUTPUT"
              echo "scheduled_check=true" >> "$GITHUB_OUTPUT"
            else
              echo "type=" >> "$GITHUB_OUTPUT"
              echo "scheduled_check=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SHOTSTACK_SANDBOX_API_KEY: ${{ secrets.SHOTSTACK_SANDBOX_API_KEY }}
          SHOTSTACK_PRODUCTION_API_KEY: ${{ secrets.SHOTSTACK_PRODUCTION_API_KEY }}
        run: |
          CMD="python -m src.main"
          if [ -n "${{ steps.run_config.outputs.type }}" ]; then
            CMD="$CMD --content-type ${{ steps.run_config.outputs.type }}"
          fi
          if [ "${{ steps.run_config.outputs.scheduled_check }}" = "true" ]; then
            CMD="$CMD --scheduled-check --check-hours 8,10,12,14,16,18,20,22"
          fi
          echo "Running: $CMD"
          $CMD

      - name: Commit updated state
        run: |
          git config user.name "social-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/posted_log.json data/post_timing.json content/posted/ content/generated/ || true
          git diff --cached --quiet || git commit -m "Update posted log / timing data [skip ci]"
          git push
