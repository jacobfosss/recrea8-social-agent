name: Nature background test
on:
  workflow_dispatch:
    inputs:
      themes:
        description: "Comma-separated themes"
        required: false
        default: "dairy,honey,cacao,vanilla,mint_greens"
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow anthropic && sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build test backgrounds
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THEMES: ${{ inputs.themes }}
        run: python scripts/nature_test.py
      - name: Save contact sheets
        if: always()
        run: |
          git config user.name "social-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/nature_test
          git commit -m "Nature background test sheets [skip ci]" || exit 0
          git pull --rebase --autostash && git push
